[package]
name = "arduino-due"
version = "0.1.0"
description = "Board support for the Arduino Due: the SAM3X8E's pins under the names on the silkscreen, the clock tree and console the board is wired for, and the memory layout"
keywords = ["arm", "cortex-m", "sam3x", "arduino", "bsp"]
categories = ["embedded", "hardware-support", "no-std"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sam3x-hal = { path = "../sam3x-hal", version = "0.1.0" }

[features]
# The PAC's runtime, for a binary.
rt = ["sam3x-hal/rt"]
# `defmt::Format` on public types.
defmt = ["sam3x-hal/defmt"]

[package.metadata.docs.rs]
all-features = true
targets = ["thumbv7m-none-eabi"]
